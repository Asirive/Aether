# Aether v2 for the 200M comparison against configs/baseline_200m.yaml.
#
# Identical recipe to the baseline except the model section:
#   model.arch: aether_v2      -> gated short conv + SelectiveSSM (Mamba-2 style) + attention
#   model.layer_pattern        -> conv, SSM, conv, attention (equal-best and fastest layout in
#                                 the CPU lab; docs/aether_v2_results.md)
#   no depth router            -> the causal router gave no gain in the lab and is NPU-hostile
#   output.dir                 -> runs/aether_v2_200m

model:
  vocab_size: 128256
  d_model: 576
  d_inner: 1536
  n_layers: 24
  n_heads: 9
  d_k: 64
  max_seq_len: 2048
  rope_base: 10000.0
  tie_embeddings: true
  arch: aether_v2
  layer_pattern: [conv, ssm, conv, attn, conv, ssm, conv, attn, conv, ssm, conv, attn, conv, ssm, conv, attn, conv, ssm, conv, attn, conv, ssm, conv, attn]
  ssm_state_dim: 64
  ssm_head_dim: 64
  fsa2_chunk_size: 64
  fsa2_n_summary: 8

fsa:
  topk_ratio: 0.25
  ortho_loss_weight: 0.01
  fsa_ortho_warmup_frac: 0.10

polymamba:
  orders: 2
  state_dim: 16
  kbal_loss_weight: 0.01
  kbal_warmup_frac: 0.05

mod:
  routing_points: []
  keep_ratios: []
  loss_weight: 0.01
  mod_warmup_frac: 0.05

training:
  total_steps: 100000
  effective_batch_tokens: 65536
  micro_batch: 2
  seq_len_default: 2048
  seq_len_phases:
    - [0.00, 0.20, 1024]
    - [0.20, 0.50, 2048]
    - [0.50, 1.00, 2048]
  precision: bfloat16
  gradient_checkpointing: true

optim:
  name: adamw_fused
  lr: 0.00012
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 1000
  min_lr_ratio: 0.1
  grad_clip: 1.0
  grad_spike_threshold: 10.0
  max_consecutive_skips: 20
  wedged_skip_limit: 200
  embed_lr_scale: 1.0

data:
  name: HuggingFaceFW/fineweb-edu
  config: sample-10BT
  tokenizer: unsloth/Llama-3.2-1B-Instruct
  num_workers: 0

eval:
  every_steps: 100
  max_new_tokens: 24
  canary_max_new_tokens: 20
  canary_every_steps: 10
  fast_benchmarks: [hellaswag, arc_easy]
  full_benchmarks: [mmlu, hellaswag, arc_challenge, arc_easy, piqa, winogrande, gsm8k, humaneval, truthfulqa_mc2, ifeval]

logging:
  log_every_steps: 50

output:
  dir: runs/aether_v2_200m
  save_every_steps: 100

tui:
  enabled: true
  refresh_hz: 4
  width: 100
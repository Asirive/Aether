model:
  vocab_size: 128256
  d_model: 256
  d_inner: 768
  n_layers: 8
  n_heads: 4
  d_k: 64
  max_seq_len: 1024
  rope_base: 10000.0
  tie_embeddings: true

fsa:
  topk_ratio: 0.25
  ortho_loss_weight: 0.01
  fsa_ortho_warmup_frac: 0.10

polymamba:
  orders: 2
  state_dim: 16
  kbal_loss_weight: 0.01
  kbal_warmup_frac: 0.05

mod:
  routing_points: [2, 4, 6]
  keep_ratios: [0.50, 0.70, 1.00]
  loss_weight: 0.01
  mod_warmup_frac: 0.05

training:
  total_steps: 2000
  effective_batch_tokens: 8192
  micro_batch: 4
  seq_len_default: 1024
  seq_len_phases:
    - [0.0, 1.0, 1024]
  precision: bfloat16
  gradient_checkpointing: true

optim:
  name: adamw_fused
  lr: 0.0005
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 100
  min_lr_ratio: 0.1
  grad_clip: 1.0

data:
  name: HuggingFaceFW/fineweb-edu
  config: sample-10BT
  tokenizer: unsloth/Llama-3.2-1B-Instruct
  num_workers: 0

eval:
  every_steps: 500
  max_new_tokens: 24
  fast_benchmarks: [hellaswag, arc_easy]
  full_benchmarks: [hellaswag, arc_easy]

logging:
  log_every_steps: 25

output:
  dir: runs/aether_25m_proxy
  save_every_steps: 1000

tui:
  enabled: false
  refresh_hz: 4
  width: 100

model:
  vocab_size: 128256
  d_model: 576
  d_inner: 1536
  n_layers: 24
  n_heads: 9
  d_k: 64
  max_seq_len: 2048
  rope_base: 10000.0
  tie_embeddings: true
fsa:
  topk_ratio: 0.25
  ortho_loss_weight: 0.01
  fsa_ortho_warmup_frac: 0.1
polymamba:
  orders: 2
  state_dim: 16
  kbal_loss_weight: 0.01
  kbal_warmup_frac: 0.05
mod:
  routing_points:
  - 4
  - 8
  - 12
  - 16
  - 20
  keep_ratios:
  - 0.5
  - 0.7
  - 0.85
  - 1.0
  - 1.0
  loss_weight: 0.01
  mod_warmup_frac: 0.05
training:
  total_steps: 900
  effective_batch_tokens: 65536
  micro_batch: 2
  seq_len_default: 2048
  seq_len_phases:
  - - 0.0
    - 0.2
    - 1024
  - - 0.2
    - 0.5
    - 2048
  - - 0.5
    - 1.0
    - 2048
  precision: bfloat16
  gradient_checkpointing: true
optim:
  name: adamw_fused
  lr: 0.00012
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 1000
  min_lr_ratio: 0.1
  grad_clip: 1.0
data:
  name: HuggingFaceFW/fineweb-edu
  config: sample-10BT
  tokenizer: unsloth/Llama-3.2-1B-Instruct
  num_workers: 0
eval:
  every_steps: 100
  max_new_tokens: 24
  canary_max_new_tokens: 20
  canary_every_steps: 10
  fast_benchmarks:
  - hellaswag
  - arc_easy
  full_benchmarks:
  - mmlu
  - hellaswag
  - arc_challenge
  - arc_easy
  - piqa
  - winogrande
  - gsm8k
  - humaneval
  - truthfulqa_mc2
  - ifeval
logging:
  log_every_steps: 10
output:
  dir: runs/_validate_stab
  save_every_steps: 50
tui:
  enabled: true
  refresh_hz: 4
  width: 100
